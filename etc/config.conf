# Dynamic Touch Sampling Rate - 全局配置
# 适配: 红米 K90 Max (prague / 2604FRK1EC)
# 修改后保存即生效, 或通过 Web 管理端修改

# 亮屏轮询间隔(秒)
poll_interval=3
# 熄屏轮询间隔(秒)
poll_idle=15
# 低电量阈值(%)
battery_low=20
# 调试模式: 0=关闭, 1=开启
debug=0
# Web 管理端端口
http_port=8080

# 采样率档位 (最高 480Hz)
rate_low=120
rate_med=240
rate_high=480

# 触摸节点配置 (自动探测后填充, 可手动修改)
# 每个节点以 node_path 开始, 后跟三档值
# node_path=/sys/devices/virtual/touch/tp_dev/boost_120hz
# node_low=0
# node_medium=1
# node_high=1
